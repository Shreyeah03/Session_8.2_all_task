{% extends "base.html" %}
{% load static %}
{% block title %}My tasks · TaskPro{% endblock %}
{% block content %}
<header class="topbar">
  <span class="brand">TaskPro</span>
  <div class="topbar-user">
    <span id="whoami" class="text-muted"></span>
    <button id="logoutBtn" class="btn btn-sm btn-outline-secondary" type="button">Log out</button>
  </div>
</header>

<main class="dash">
  <aside class="panel form-panel">
    <h2 id="formTitle" class="panel-title">Add a task</h2>
    <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>
    <form id="taskForm" novalidate>
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input id="title" name="title" class="form-control" maxlength="200" required>
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" name="description" class="form-control" rows="3"></textarea>
        <div class="invalid-feedback"></div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-6">
          <label for="priority" class="form-label">Priority</label>
          <select id="priority" name="priority" class="form-select">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-6">
          <label for="due_date" class="form-label">Due date</label>
          <input id="due_date" name="due_date" type="date" class="form-control" required>
          <div class="invalid-feedback"></div>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button id="saveBtn" class="btn btn-primary flex-grow-1" type="submit">Add task</button>
        <button id="cancelEditBtn" class="btn btn-outline-secondary d-none" type="button">Cancel</button>
      </div>
    </form>
  </aside>

  <section class="list-panel">
    <div class="toolbar">
      <div class="btn-group status-tabs" role="group" aria-label="Filter by status">
        <button type="button" class="btn active" data-status="all">All</button>
        <button type="button" class="btn" data-status="pending">Pending</button>
        <button type="button" class="btn" data-status="completed">Completed</button>
      </div>
      <input id="search" type="search" class="form-control" placeholder="Search by title" aria-label="Search by title">
      <select id="priorityFilter" class="form-select" aria-label="Filter by priority">
        <option value="">Any priority</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <p id="count" class="list-count" aria-live="polite"></p>
    <ul id="taskList" class="task-list"></ul>
    <div id="emptyState" class="empty d-none"></div>
  </section>
</main>
{% endblock %}
{% block scripts %}<script src="{% static 'js/dashboard.js' %}"></script>{% endblock %}
